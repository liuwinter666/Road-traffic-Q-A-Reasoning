# Trừ điểm GPLX (NĐ 168 và sửa đổi — chỉ V3, V4)
tru_diem:
  ap_dung_phien_ban: [V3, V4]
  nhieu_hanh_vi: {id: ND168-D50-K1-b, trich: "chỉ áp dụng trừ điểm đối với hành vi vi phạm bị trừ nhiều điểm nhất"}
  khong_qua_diem_con_lai: {id: ND168-D50-K1-c, trich: "Trường hợp số điểm còn lại của giấy phép lái xe ít hơn số điểm bị trừ thì áp dụng trừ hết số điểm còn lại của giấy phép lái xe đó"}
  dang_bi_tuoc: {id: ND168-D50-K1-dd, trich: "Không trừ điểm giấy phép lái xe khi giấy phép lái xe đó đang trong thời hạn bị tước quyền sử dụng giấy phép lái xe"}
