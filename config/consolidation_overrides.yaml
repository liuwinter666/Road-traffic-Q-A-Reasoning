# Quyết định thủ công cho các lệnh sửa đổi mà consolidate.py không tự áp được.
# Khóa `ref` phải khớp đúng chuỗi "Lệnh" trong data/processed/consolidation_review.md.
#
# Nguyên tắc (chủ nhiệm đồ án, 03/11/2026): văn bản sửa đổi sửa chữ nào thì hệ thống theo chữ đó;
# nhóm không có quyền giữ chữ cũ. Các quyết định dưới đây chỉ làm rõ CÁCH áp, không đổi NỘI DUNG lệnh.
#
# action:
#   replace_all  – (lệnh thay/bỏ cụm từ) thay TẤT CẢ các lần xuất hiện trong đơn vị đích
#   split        – lệnh ghép nhiều cụm từ trong một câu: `parts` là các lệnh đơn viết lại đúng nguyên văn
#   skip         – bỏ qua lệnh, ghi nhận là đã duyệt
#   set_text     – gán nguyên văn cho đơn vị: cần thêm `id` và `text`
# Tùy chọn: match_case: false (khớp không phân biệt hoa/thường), allow_missing: true (đích không chứa
#   cụm từ thì bỏ qua đích đó và ghi chú, thay vì dừng cả lệnh).

overrides:
