  XM_DEN_DO: {xe: [NhomXeMoTo], dk: [KhongChapHanhDenTinHieu], vi_du: {xe: XeMoToHaiBanh, su_kien: {khongChapHanhDenTinHieu: true}}}
  XM_HIEU_LENH_CSGT: {xe: [NhomXeMoTo], dk: [KhongChapHanhHieuLenhNguoiDieuKhienGT],
                      vi_du: {xe: XeMoToHaiBanh, su_kien: {coHieuLenhNguoiDieuKhienGT: true, chapHanhHieuLenh: false}}}
  XM_NGUOC_CHIEU: {xe: [NhomXeMoTo], dk: [DiNguocChieu], vi_du: {xe: XeMoToHaiBanh, su_kien: {diNguocChieu: true}, duong: [DuongMotChieu]}}
  XM_SAI_PHAN_LAN: {xe: [NhomXeMoTo], dk: [DiSaiPhanDuongLanDuong], vi_du: {xe: XeMoToHaiBanh, su_kien: {diSaiPhanDuongLanDuong: true}}}
  XM_CHUYEN_LAN: {xe: [NhomXeMoTo], dk: [ChuyenLanSaiQuyDinh], vi_du: {xe: XeMoToHaiBanh, su_kien: {chuyenLanSaiQuyDinh: true}}}
  XM_MU_BAO_HIEM: {xe: [NhomXeMoTo], dk: [KhongDoiMuBaoHiem], vi_du: {xe: XeMoToHaiBanh, su_kien: {doiMuBaoHiem: false}}}
