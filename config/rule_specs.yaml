    phien_ban: {"V3,V4": {xe: [[XeMoToHaiBanh, XeMoToHangLonND168], XeMoToBaBanh]}}
  OT_KHONG_GPLX: {xe: [NhomXeOTo], dk: [KhongCoGPLX], vi_du: {xe: OTo, su_kien: {coGPLX: false}}}

  # ===================== ĐỘ TUỔI =====================
  CHUA_DU_TUOI_14_16: {xe: [NhomXeMoTo, NhomXeOTo], nguoi: [NguoiTu14Den16Tuoi], vi_du: {xe: XeGanMay, nguoi: {tuoi: 15}}}
