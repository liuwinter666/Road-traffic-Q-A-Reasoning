  XM_TD_05_10: {xe: [NhomXeMoTo], dk: [VuotTocDo05Den10], vi_du: {xe: XeMoToHaiBanh, su_kien: {tocDoThucTe: 55, tocDoToiDaChoPhep: 50}}}
