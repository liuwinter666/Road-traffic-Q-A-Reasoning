  XM_TD_TREN_20: {xe: [NhomXeMoTo], dk: [VuotTocDoTren20], vi_du: {xe: XeMoToHaiBanh, su_kien: {tocDoThucTe: 85, tocDoToiDaChoPhep: 60}}}

