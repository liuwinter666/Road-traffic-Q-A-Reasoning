  OT_KHONG_MANG_DANG_KY:
    xe: [NhomXeOTo]
    dk: [KhongMangTheoDangKyXe]
    vi_du: {xe: OTo, su_kien: {coDangKyXe: true, mangTheoDangKyXe: false, kinhDoanhVanTai: true}}
    phien_ban: {"V3,V4": {dk: [[KhongMangTheoDangKyXe, XeKinhDoanhVanTai]]}}
  XM_KHONG_BAO_HIEM:
    xe: [NhomXeMoTo]
    dk: [KhongCoBaoHiemTNDS, KhongMangTheoBaoHiemTNDS]
    vi_du: {xe: XeMoToHaiBanh, su_kien: {coBaoHiemTNDS: false}}
    phien_ban: {"V3,V4": {dk: [KhongCoBaoHiemTNDS]}}
  OT_KHONG_BAO_HIEM:
    xe: [NhomXeOTo]
    dk: [KhongCoBaoHiemTNDS, KhongMangTheoBaoHiemTNDS]
    vi_du: {xe: OTo, su_kien: {coBaoHiemTNDS: false}}
    phien_ban: {"V3,V4": {dk: [KhongCoBaoHiemTNDS]}}
  XM_KHONG_DANG_KY: {xe: [NhomXeMoTo], dk: [KhongCoDangKyXe], vi_du: {xe: XeMoToHaiBanh, su_kien: {coDangKyXe: false}}}
  OT_KHONG_DANG_KY: {xe: [NhomXeOTo], dk: [KhongCoDangKyXe], vi_du: {xe: OTo, su_kien: {coDangKyXe: false}}}
