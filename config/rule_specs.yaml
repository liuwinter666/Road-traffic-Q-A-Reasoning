  OT_TD_10_20: {xe: [NhomXeOTo], dk: [VuotTocDo10Den20], vi_du: {xe: OTo, su_kien: {tocDoThucTe: 70, tocDoToiDaChoPhep: 60}}}
  OT_TD_20_35: {xe: [NhomXeOTo], dk: [VuotTocDoTren20Den35], vi_du: {xe: OTo, su_kien: {tocDoThucTe: 115, tocDoToiDaChoPhep: 90}}}
