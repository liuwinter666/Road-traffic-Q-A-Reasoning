  XM_DIEN_THOAI: {xe: [NhomXeMoTo], dk: [DungTaySuDungDienThoai], vi_du: {xe: XeMoToHaiBanh, su_kien: {dungTaySuDungDienThoai: true}}}
  XM_LIEN_QUAN_TAI_NAN_KHONG_DUNG: {xe: [NhomXeMoTo], dk: [LienQuanTaiNanKhongDungLai], loai_tru_boi: [XM_GAY_TAI_NAN_BO_TRON],
