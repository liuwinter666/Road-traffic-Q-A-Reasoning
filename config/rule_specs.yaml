# Đặc tả luật SWRL cho các hành vi MVP. `python -m src.kb.rules_builder` sinh ra
#   ontology/rules/{alcohol,speed,signal,resistance,documents,penalty_decision}.swrl
#   ontology/rule_registry.yaml
#
# Thân luật chung (act mặc định HanhViDieuKhienXe):
#   <act>(?h), thuocVuViec(?h, ?v), apDungPhienBan(?v, <V>), chuThe(?h, ?n), suDungPhuongTien(?h, ?x),
#   <xe>(?x)..., <dk>(?h)..., <nguoi>(?n)..., <extra>
# Kết luận: HV_<mã>(?h), apDungDieuKhoan(?h, <V>_<id>), duocSuyRaBoi(?h, <Rxxx>), viPhamHanhVi(?n, ?h)
#
# xe / dk / nguoi: danh sách PHƯƠNG ÁN (hoặc); mỗi phương án là một lớp hoặc danh sách lớp (và).
#   Tích các phương án → nhiều luật cho cùng hành vi/phiên bản. Không dùng SWRL built-in.
# phien_ban: ghi đè theo phiên bản (khóa "V1", "V1,V2", ...). Điều khoản lấy từ config/mvp_behaviors.yaml.
# loai_tru_boi: hành vi này KHÔNG áp khi hành vi kia cũng được kết luận cho cùng hành vi thực tế
#   (câu "trừ hành vi vi phạm quy định tại ..." hoặc nguyên tắc một hành vi chỉ bị xử phạt một lần).
# vi_du: tình huống mẫu để test tự động (abox.build_case): xe, xe_tt, nguoi, su_kien, duong, chu_xe.

files:
  nong_do_con: alcohol
  ma_tuy: alcohol
  toc_do: speed
  tin_hieu: signal
  phan_lan: signal
  thiet_bi: signal
  an_toan: signal
  tai_nan: signal
  lai_nguy_hiem: signal
  cong_vu: resistance
  giay_to: documents
  gplx: documents
  do_tuoi: documents
  chu_xe: documents

