    # Chỉ áp cho các phiên bản có NĐ 238 trong nguồn hợp nhất (V4 trở đi).
    element_effectivity:
      - ids: [ND168-D20-K5-l, ND168-D21-K3-b, ND168-D32-K9a-b]
        pham_vi: mot_phan
        mo_ta_pham_vi: "Phần quy định về thiết bị ghi nhận hình ảnh người lái xe đối với xe ô tô kinh doanh vận tải hành khách dưới 08 chỗ (không kể chỗ của người lái xe), xe ô tô kinh doanh vận tải hàng hóa (trừ xe ô tô đầu kéo), xe vận tải nội bộ"
        effective_from: 2028-01-01
        evidence: "Quy định xử phạt vi phạm hành chính liên quan đến thiết bị ghi nhận hình ảnh người lái xe đối với xe ô tô kinh doanh vận tải hành khách dưới 08 chỗ (không kể chỗ của người lái xe), xe ô tô kinh doanh vận tải hàng hóa (trừ xe ô tô đầu kéo), xe vận tải nội bộ tại điểm l khoản 5 Điều 20, điểm b khoản 3 Điều 21, điểm b khoản 9a Điều 32 của Nghị định này có hiệu lực thi hành từ ngày 01 tháng 01 năm 2028"
        verified: true
      - ids: [ND168-D20-K5-n, ND168-D26-K7-k, ND168-D26-K7-l]
        pham_vi: toan_bo
        effective_from: 2029-01-01
        hieu_luc_dieu_kien: "theo quy định của pháp luật về thiết bị ghi nhận hình ảnh khoang chở khách trên phương tiện giao thông đường bộ"
        dieu_kien_da_dap_ung: false
        evidence: "Quy định xử phạt vi phạm hành chính liên quan đến thiết bị ghi nhận hình ảnh khoang chở khách tại điểm n khoản 5 Điều 20; điểm k, điểm l khoản 7 Điều 26 của Nghị định này có hiệu lực thi hành từ ngày 01 tháng 01 năm 2029 và theo quy định của pháp luật về thiết bị ghi nhận hình ảnh khoang chở khách trên phương tiện giao thông đường bộ"
        verified: true

# Phiên bản pháp lý. Khoảng hiệu lực là [effective_from, effective_to] (bao gồm hai đầu).
# build.base: văn bản gốc; build.base_version: kế thừa phiên bản trước; build.amendments: áp lần lượt.
versions:
  V1:
    label: "NĐ 100/2019 nguyên bản"
    effective_from: 2020-01-01
    effective_to: 2021-12-31
    build:
      base: ND100
  V2:
    label: "NĐ 100/2019 hợp nhất sửa đổi của NĐ 123/2021"
    effective_from: 2022-01-01
    effective_to: 2024-12-31
    build:
      base_version: V1
      amendments: [ND123]
  V3:
    label: "NĐ 168/2024"
    effective_from: 2025-01-01
    effective_to: 2026-08-14
    build:
      base: ND168
  V4:
    label: "NĐ 168/2024 hợp nhất sửa đổi của NĐ 238/2026"
    effective_from: 2026-08-15
    effective_to: null
    build:
      base_version: V3
      amendments: [ND238]

# Phiên bản dùng khi không rõ thời điểm vi phạm.
#   "current" = phiên bản đang có hiệu lực tại ngày chạy hệ thống; hoặc ghi tên cụ thể (vd. V3).
#   Đã chốt (duyệt Phase 4): current — đặc tả ghi V3 khi chưa có NĐ 238; từ 15/8/2026 luật hiện hành là V4.
default_version: current

# Văn bản đã biết là tồn tại nhưng CHƯA có trong data/raw/. Dùng để cảnh báo khi
# thời điểm vi phạm rơi vào khoảng hiệu lực của chúng.
pending_documents: []

# ---------------------------------------------------------------------------
# element_effectivity — hiệu lực tới cấp phần tử, kể cả một phần nội dung của phần tử:
#   pham_vi: toan_bo | mot_phan
#   mo_ta_pham_vi: (mot_phan) mô tả phần nội dung có hiệu lực riêng; phần còn lại theo phiên bản
#   effective_from: ngày bắt đầu hiệu lực; null = chưa xác định được ngày
#   hieu_luc_dieu_kien: hiệu lực còn phụ thuộc văn bản khác. Hệ thống coi là CHƯA có hiệu lực
#       (kể cả khi đã qua effective_from) cho tới khi dieu_kien_da_dap_ung: true kèm căn cứ.
#   evidence: trích nguyên văn quy định về hiệu lực (test kiểm tra có trong văn bản nguồn)
# ---------------------------------------------------------------------------

