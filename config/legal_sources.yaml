    evidence: "Điều 4: Nghị định này có hiệu lực thi hành từ ngày 01 tháng 01 năm 2022."
    verified: true

  ND168:
    file: ND_168.docx
    so_hieu: "168/2024/NĐ-CP"
    ten: "Nghị định quy định xử phạt vi phạm hành chính về trật tự, an toàn giao thông trong lĩnh vực giao thông đường bộ; trừ điểm, phục hồi điểm giấy phép lái xe"
    ngay_ban_hanh: 2024-12-26
    type: base
    effective_from: 2025-01-01
    evidence: "Điều 53 khoản 1: Nghị định này có hiệu lực thi hành từ ngày 01 tháng 01 năm 2025, trừ quy định tại khoản 2 Điều này."
    verified: true
    # Hiệu lực riêng theo phần tử (Điều 53 khoản 2). Xem chú thích "element_effectivity" ở cuối file.
    element_effectivity:
      - ids: [ND168-D6-K3-m, ND168-D26-K4-e, ND168-D27-K1-b]
        pham_vi: toan_bo
        effective_from: 2026-01-01
        evidence: "Điều 53 khoản 2: Quy định tại điểm m khoản 3 Điều 6, điểm e khoản 4 Điều 26, điểm b khoản 1 Điều 27 của Nghị định này có hiệu lực thi hành từ ngày 01 tháng 01 năm 2026"
        verified: true
      - ids: [ND168-D32-K1-b]
        pham_vi: toan_bo
        effective_from: null
        hieu_luc_dieu_kien: "theo quy định của pháp luật bảo vệ môi trường về kiểm định khí thải xe mô tô, xe gắn máy"
        dieu_kien_da_dap_ung: false
        evidence: "Điều 53 khoản 2: quy định tại điểm b khoản 1 Điều 32 của Nghị định này có hiệu lực thi hành theo quy định của pháp luật bảo vệ môi trường về kiểm định khí thải xe mô tô, xe gắn máy."
        verified: true

  ND238:
    file: ND_238.docx
    so_hieu: "238/2026/NĐ-CP"
    ten: "Nghị định sửa đổi, bổ sung một số điều của Nghị định số 168/2024/NĐ-CP"
    ngay_ban_hanh: 2026-06-26
    type: amendment
