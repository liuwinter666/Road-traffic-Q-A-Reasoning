- id: P009
  phien_ban: V4
  van_ban_sua: ND238_2026
  lenh_goc: 'ND238 Điều 19 khoản 11: Thay thế cụm từ "giấy chứng nhận kiểm định" bằng cụm từ "chứng nhận kiểm định" tại điểm d khoản 3 Điều 13'
  vi_tri: ND168-D13-K3-d
  truoc: d) Điều khiển xe ô tô kinh doanh vận tải hành khách lắp thêm hoặc tháo bớt ghế, giường nằm hoặc có kích thước khoang chở hành lý (hầm xe) không đúng với thông số kỹ thuật được ghi trong giấy chứng nhận kiểm định an toàn kỹ thuật và bảo vệ môi trường của xe.
  sau: d) Điều khiển xe ô tô kinh doanh vận tải hành khách lắp thêm hoặc tháo bớt ghế, giường nằm hoặc có kích thước khoang chở hành lý (hầm xe) không đúng với thông số kỹ thuật được ghi trong chứng nhận kiểm định an toàn kỹ thuật và bảo vệ môi trường của xe.
  ghi_chu: ''
  anh_huong_mvp: false
  trang_thai: cho_duyet
- id: P010
  phien_ban: V4
  van_ban_sua: ND238_2026
  lenh_goc: 'ND238 Điều 19 khoản 11: Thay thế cụm từ "giấy chứng nhận kiểm định" bằng cụm từ "chứng nhận kiểm định" tại điểm b khoản 4 Điều 13'
  vi_tri: ND168-D13-K4-b
  truoc: b) Điều khiển xe ô tô tải (kể cả rơ moóc và sơ mi rơ moóc) có kích thước thùng xe không đúng với thông số kỹ thuật được ghi trong giấy chứng nhận kiểm định an toàn kỹ thuật và bảo vệ môi trường của xe;
  sau: b) Điều khiển xe ô tô tải (kể cả rơ moóc và sơ mi rơ moóc) có kích thước thùng xe không đúng với thông số kỹ thuật được ghi trong chứng nhận kiểm định an toàn kỹ thuật và bảo vệ môi trường của xe;
