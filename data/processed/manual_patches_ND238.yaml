- id: P001
  phien_ban: V4
  van_ban_sua: ND238_2026
  lenh_goc: 'ND238 Điều 17 khoản 2: Sửa đổi, bổ sung đoạn thứ hai điểm a khoản 3 [Điều 50]'
  vi_tri: ND168-D50-K3-a (đoạn 2)
  truoc: Trường hợp Chủ tịch Ủy ban nhân dân cấp huyện, Chủ tịch Ủy ban nhân dân cấp tỉnh ra quyết định xử phạt vi phạm hành chính đối với hành vi vi phạm có trừ điểm giấy phép lái xe thì Trưởng Công an cấp huyện hoặc Trưởng phòng Cảnh sát giao thông Công an cấp tỉnh có trách nhiệm cập nhật dữ liệu trừ điểm giấy phép lái xe vào Cơ sở dữ liệu về xử lý vi phạm hành chính về trật tự, an toàn giao thông đường bộ;
  sau: Trường hợp Chủ tịch Ủy ban nhân dân cấp xã, Chủ tịch Ủy ban nhân dân cấp tỉnh ra quyết định xử phạt vi phạm hành chính đối với hành vi vi phạm có trừ điểm giấy phép lái xe thì Trưởng phòng Cảnh sát giao thông Công an cấp tỉnh có trách nhiệm cập nhật dữ liệu trừ điểm giấy phép lái xe vào Cơ sở dữ liệu về xử lý vi phạm hành chính về trật tự, an toàn giao thông đường bộ;
  ghi_chu: 'Điểm a có 2 đoạn: đoạn 1 bắt đầu "a) Ngay sau khi...", đoạn 2 bắt đầu "Trường hợp...". Chỉ thay đoạn 2, đoạn 1 giữ nguyên.'
  anh_huong_mvp: false
  trang_thai: cho_duyet
- id: P002
  phien_ban: V4
  van_ban_sua: ND238_2026
  lenh_goc: 'ND238 Điều 19 khoản 8: Bổ sung cụm từ "Điều 20 (điểm l khoản 5, điểm đ khoản 6), Điều 21 (điểm b khoản 3, điểm c khoản 5)," vào trước cụm từ "Điều 29", cụm từ "; khoản 9a" vào sau cụm từ "điểm n khoản 7" tại điểm h khoản 3 Điều 47.'
  vi_tri: ND168-D47-K3-h
  truoc: h) Các hành vi vi phạm quy định về lắp, sử dụng thiết bị giám sát hành trình, thiết bị ghi nhận hình ảnh người lái xe trên xe ô tô quy định tại Điều 29 (khoản 1, khoản 3), Điều 30 (khoản 1, khoản 2) và các hành vi vi phạm tương ứng quy định tại Điều 32 (điểm m, điểm n khoản 7), trong trường hợp chủ phương tiện là người trực tiếp điều khiển phương tiện thì bị xử phạt theo quy định tại các điểm, khoản tương ứng của Điều 32 của Nghị định này;
  sau: h) Các hành vi vi phạm quy định về lắp, sử dụng thiết bị giám sát hành trình, thiết bị ghi nhận hình ảnh người lái xe trên xe ô tô quy định tại Điều 20 (điểm l khoản 5, điểm đ khoản 6), Điều 21 (điểm b khoản 3, điểm c khoản 5), Điều 29 (khoản 1, khoản 3), Điều 30 (khoản 1, khoản 2) và các hành vi vi phạm tương ứng quy định tại Điều 32 (điểm m, điểm n khoản 7; khoản 9a), trong trường hợp chủ phương tiện là người trực tiếp điều khiển phương tiện thì bị xử phạt theo quy định tại các điểm, khoản tương ứng của Điều 32 của Nghị định này;
  ghi_chu: Lệnh ghép 2 thao tác. "Điều 29" chỉ xuất hiện 1 lần trong điểm h; "điểm n khoản 7" cũng 1 lần. Không có mơ hồ.
  anh_huong_mvp: false
  trang_thai: cho_duyet
- id: P003
  phien_ban: V4
  van_ban_sua: ND238_2026
  lenh_goc: 'ND238 Điều 19 khoản 12 (vế 1): Bỏ cụm từ "giấy chứng nhận kiểm định an toàn kỹ thuật và bảo vệ  môi trường" tại điểm b, điểm d khoản 7 Điều 32'
  vi_tri: ND168-D32-K7-b
  truoc: b) Không làm thủ tục thu hồi chứng nhận đăng ký xe; biển số xe; giấy chứng nhận kiểm định an toàn kỹ thuật và bảo vệ môi trường theo quy định;
  sau: b) Không làm thủ tục thu hồi chứng nhận đăng ký xe; biển số xe theo quy định;
  ghi_chu: 'Bỏ cụm từ theo nghĩa đen sẽ còn "biển số xe;  theo quy định;" (thừa dấu ; và khoảng trắng). Bản SAU đã dọn dấu câu, CẦN DUYỆT. Lưu ý: văn bản NĐ 238 có 2 dấu cách giữa "vệ" và "môi" nên so khớp phải chuẩn hóa khoảng trắng.'
  anh_huong_mvp: false
  trang_thai: cho_duyet
- id: P004
  phien_ban: V4
  van_ban_sua: ND238_2026
  lenh_goc: 'ND238 Điều 19 khoản 12 (vế 1): như P003, tại điểm d khoản 7 Điều 32'
  vi_tri: ND168-D32-K7-d
  truoc: d) Khai báo không đúng sự thật hoặc sử dụng các giấy tờ, tài liệu giả để được cấp lại biển số xe, chứng nhận đăng ký xe, giấy chứng nhận kiểm định an toàn kỹ thuật và bảo vệ môi trường nhưng chưa đến mức bị truy cứu trách nhiệm hình sự;
  sau: d) Khai báo không đúng sự thật hoặc sử dụng các giấy tờ, tài liệu giả để được cấp lại biển số xe, chứng nhận đăng ký xe nhưng chưa đến mức bị truy cứu trách nhiệm hình sự;
  ghi_chu: Bỏ luôn dấu phẩy đứng trước cụm từ để câu liền mạch ("...chứng nhận đăng ký xe nhưng chưa đến mức..."). CẦN DUYỆT.
  anh_huong_mvp: false
  trang_thai: cho_duyet
- id: P005
  phien_ban: V4
  van_ban_sua: ND238_2026
  lenh_goc: 'ND238 Điều 19 khoản 12 (vế 2): Bỏ cụm từ "điểm e, điểm g khoản 7;" tại điểm đ khoản 18 Điều 32'
  vi_tri: ND168-D32-K18-đ
  truoc: đ) Thực hiện hành vi quy định tại khoản 5, khoản 6 Điều này trong trường hợp chở vượt trên 50% số người quy định được phép chở của phương tiện còn bị tước quyền sử dụng phù hiệu từ 01 tháng đến 03 tháng (nếu có). Thực hiện hành vi quy định tại điểm e, điểm g khoản 7; điểm a, điểm b khoản 11; điểm a, điểm b, điểm c, điểm đ khoản 13; điểm a, điểm b, điểm c, điểm d, điểm đ, điểm e, điểm g khoản 14; khoản 15; khoản 16 Điều này còn bị tước quyền sử dụng phù hiệu từ 01 tháng đến 03 tháng (nếu có).
  sau: đ) Thực hiện hành vi quy định tại khoản 5, khoản 6 Điều này trong trường hợp chở vượt trên 50% số người quy định được phép chở của phương tiện còn bị tước quyền sử dụng phù hiệu từ 01 tháng đến 03 tháng (nếu có). Thực hiện hành vi quy định tại điểm a, điểm b khoản 11; điểm a, điểm b, điểm c, điểm đ khoản 13; điểm a, điểm b, điểm c, điểm d, điểm đ, điểm e, điểm g khoản 14; khoản 15; khoản 16 Điều này còn bị tước quyền sử dụng phù hiệu từ 01 tháng đến 03 tháng (nếu có).
  ghi_chu: Cụm từ xuất hiện đúng 1 lần.
  anh_huong_mvp: false
  trang_thai: cho_duyet
- id: P006
  phien_ban: V4
  van_ban_sua: ND238_2026
  lenh_goc: 'ND238 Điều 19 khoản 16: Bỏ cụm từ "trực thuộc trung ương" tại Điều 55'
  vi_tri: ND168-D55
  truoc: Các Bộ trưởng, Thủ trưởng cơ quan ngang bộ, Thủ trưởng cơ quan thuộc Chính phủ, Chủ tịch Ủy ban nhân dân các tỉnh, thành phố trực thuộc Trung ương và các cơ quan, đơn vị có liên quan chịu trách nhiệm thi hành Nghị định này./.
  sau: Các Bộ trưởng, Thủ trưởng cơ quan ngang bộ, Thủ trưởng cơ quan thuộc Chính phủ, Chủ tịch Ủy ban nhân dân các tỉnh, thành phố và các cơ quan, đơn vị có liên quan chịu trách nhiệm thi hành Nghị định này./.
  ghi_chu: NĐ 168 viết hoa "Trung ương" nên so khớp phân biệt hoa thường thất bại. Cụm "trực thuộc trung ương" ở Điều 44 khoản 3 (dòng Chánh Thanh tra) KHÔNG thuộc phạm vi lệnh, giữ nguyên.
  anh_huong_mvp: false
  trang_thai: cho_duyet
- id: P007
  phien_ban: V4
  van_ban_sua: ND238_2026
  lenh_goc: 'ND238 Điều 19 khoản 11: Thay thế cụm từ "giấy chứng nhận kiểm định" bằng cụm từ "chứng nhận kiểm định" tại điểm q khoản 3 Điều 3'
  vi_tri: ND168-D3-K3-q
  truoc: q) Buộc thực hiện điều chỉnh thùng xe theo đúng quy định hiện hành, đăng kiểm lại và điều chỉnh lại khối lượng hàng hóa cho phép chuyên chở được ghi trong giấy chứng nhận kiểm định an toàn kỹ thuật và bảo vệ môi trường theo quy định hiện hành trước khi đưa phương tiện ra tham gia giao thông;
  sau: q) Buộc thực hiện điều chỉnh thùng xe theo đúng quy định hiện hành, đăng kiểm lại và điều chỉnh lại khối lượng hàng hóa cho phép chuyên chở được ghi trong chứng nhận kiểm định an toàn kỹ thuật và bảo vệ môi trường theo quy định hiện hành trước khi đưa phương tiện ra tham gia giao thông;
  ghi_chu: ''
