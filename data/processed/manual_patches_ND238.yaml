- id: P011
  phien_ban: V4
  van_ban_sua: ND238_2026
  lenh_goc: 'ND238 Điều 19 khoản 11: Thay thế cụm từ "giấy chứng nhận kiểm định" bằng cụm từ "chứng nhận kiểm định" tại điểm c khoản 3 Điều 18'
  vi_tri: ND168-D18-K3-c
  truoc: c) Người điều khiển xe ô tô, xe chở người bốn bánh có gắn động cơ, xe chở hàng bốn bánh có gắn động cơ, rơ moóc, sơ mi rơ moóc và các loại xe tương tự xe ô tô kinh doanh vận tải không mang theo giấy chứng nhận kiểm định an toàn kỹ thuật và bảo vệ môi trường đối với loại xe có quy định phải kiểm định.
  sau: c) Người điều khiển xe ô tô, xe chở người bốn bánh có gắn động cơ, xe chở hàng bốn bánh có gắn động cơ, rơ moóc, sơ mi rơ moóc và các loại xe tương tự xe ô tô kinh doanh vận tải không mang theo chứng nhận kiểm định an toàn kỹ thuật và bảo vệ môi trường đối với loại xe có quy định phải kiểm định.
  ghi_chu: ''
  anh_huong_mvp: false
  trang_thai: cho_duyet
- id: P012
  phien_ban: V4
  van_ban_sua: ND238_2026
  lenh_goc: 'ND238 Điều 19 khoản 11: Thay thế cụm từ "giấy chứng nhận kiểm định" bằng cụm từ "chứng nhận kiểm định" tại điểm a khoản 2 Điều 21'
  vi_tri: ND168-D21-K2-a
  truoc: a) Điều khiển xe (kể cả rơ moóc và sơ mi rơ moóc) chở hàng vượt trọng tải (khối lượng hàng chuyên chở) cho phép tham gia giao thông được ghi trong giấy chứng nhận kiểm định an toàn kỹ thuật và bảo vệ môi trường của xe trên 10% đến 30% (trừ xe xi téc chở chất lỏng), trên 20% đến 30% đối với xe xi téc chở chất lỏng;
  sau: a) Điều khiển xe (kể cả rơ moóc và sơ mi rơ moóc) chở hàng vượt trọng tải (khối lượng hàng chuyên chở) cho phép tham gia giao thông được ghi trong chứng nhận kiểm định an toàn kỹ thuật và bảo vệ môi trường của xe trên 10% đến 30% (trừ xe xi téc chở chất lỏng), trên 20% đến 30% đối với xe xi téc chở chất lỏng;
  ghi_chu: ''
  anh_huong_mvp: false
  trang_thai: cho_duyet
- id: P013
  phien_ban: V4
  van_ban_sua: ND238_2026
  lenh_goc: 'ND238 Điều 19 khoản 11: Thay thế cụm từ "giấy chứng nhận kiểm định" bằng cụm từ "chứng nhận kiểm định" tại điểm d khoản 2 Điều 21'
  vi_tri: ND168-D21-K2-d
  truoc: d) Điều khiển xe kéo theo rơ moóc, sơ mi rơ moóc mà khối lượng toàn bộ (bao gồm khối lượng bản thân rơ moóc, sơ mi rơ moóc và khối lượng hàng chuyên chở) của rơ moóc, sơ mi rơ moóc vượt khối lượng cho phép kéo theo được ghi trong giấy chứng nhận kiểm định an toàn kỹ thuật và bảo vệ môi trường của xe trên 10% đến 30%;
  sau: d) Điều khiển xe kéo theo rơ moóc, sơ mi rơ moóc mà khối lượng toàn bộ (bao gồm khối lượng bản thân rơ moóc, sơ mi rơ moóc và khối lượng hàng chuyên chở) của rơ moóc, sơ mi rơ moóc vượt khối lượng cho phép kéo theo được ghi trong chứng nhận kiểm định an toàn kỹ thuật và bảo vệ môi trường của xe trên 10% đến 30%;
