# Bộ tình huống đánh giá — NGUỒN do người gán nhãn (xem data/test/annotation_guide.md).
# `python -m evaluation.sinh_nhan` sinh data/test/scenarios.jsonl: thêm điều khoản + khung phạt chuẩn (tra từ
# ontology/rule_registry.yaml theo mã hành vi + phiên bản) và các node dấu hiệu kỳ vọng.
#
# Ngày "hôm nay" khi chạy đánh giá cố định là 2026-11-06 ("hôm qua" = 2026-11-05 → V4; không nêu ngày → V4).
# Khóa tra_loi = tên trường câu hỏi của slot_checker (config/slots.yaml); người dùng mô phỏng trả lời theo đó.

hom_nay: "2026-11-06"

loai_xe:            # tập lớp chấp nhận cho trường loai_xe
