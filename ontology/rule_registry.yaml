      id: ND168-D32-K14-i
      iri: V4_ND168-D32-K14-i
      van_ban: NĐ 168/2024/NĐ-CP
      dieu: '32'
      khoan: '14'
      diem: i
      trich_dan: điểm i khoản 14 Điều 32 NĐ 168/2024/NĐ-CP
      nguyen_van: 'Điều 32. Xử phạt, trừ điểm giấy phép lái xe đối với chủ phương tiện vi phạm quy định liên quan đến giao thông đường bộ

        14. Phạt tiền từ 28.000.000 đồng đến 30.000.000 đồng đối với cá nhân, từ 56.000.000 đồng đến 60.000.000 đồng đối với tổ chức là chủ xe ô tô, xe chở người bốn bánh có gắn động cơ, xe chở hàng bốn
        bánh có gắn động cơ, xe máy chuyên dùng và các loại xe tương tự xe ô tô thực hiện một trong các hành vi vi phạm sau đây:

        i) Giao xe hoặc để cho người không đủ điều kiện theo quy định tại khoản 1 Điều 56 (đối với xe ô tô, xe chở người bốn bánh có gắn động cơ, xe chở hàng bốn bánh có gắn động cơ và các loại xe tương
        tự xe ô tô), khoản 2 Điều 56 (đối với xe máy chuyên dùng) của Luật Trật tự, an toàn giao thông đường bộ điều khiển xe tham gia giao thông (bao gồm cả trường hợp người điều khiển phương tiện có giấy
        phép lái xe nhưng đã hết hạn sử dụng hoặc đang trong thời gian bị tước quyền sử dụng; chứng chỉ bồi dưỡng kiến thức pháp luật về giao thông đường bộ bị tước quyền sử dụng trước ngày 01/01/2025 và
        đang trong thời gian bị tước).'
      hieu_luc_tu: '2026-08-15'
      hieu_luc_den: null
      duoc_sua_doi: false
    swrl: HanhViGiaoXe(?h), thuocVuViec(?h, ?v), apDungPhienBan(?v, V4), chuThe(?h, ?n), suDungPhuongTien(?h, ?x), NhomXeOTo(?x), giaoXeCho(?h, ?m), NguoiKhongDuDieuKienDieuKhienXe(?m) -> HV_CHU_OT_GIAO_XE(?h),
      QT_R257(?h), apDungDieuKhoan(?h, V4_ND168-D32-K14-i), duocSuyRaBoi(?h, R257), viPhamHanhVi(?n, ?h)
  R258:
